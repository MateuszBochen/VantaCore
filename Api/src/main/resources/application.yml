spring:
  application:
    name: VantaCore


  security:
    jwt:
      # No default on purpose - a secret checked into a public repo can be used to forge tokens, so
      # startup fails unless JWT_SECRET is set (the dev profile in application-dev.yml supplies one).
      secret: ${JWT_SECRET}
      expiration: ${JWT_EXPIRATION:3600000}

  datasource:
    url: jdbc:postgresql://db:5432/vantacore
    username: vantacore
    password: vantacore
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Existing (pre-Flyway) DBs already have the V1 baseline schema on disk, just with no
    # flyway_schema_history row for it - baseline them AT version 1 so V1 is treated as already
    # applied and only V2+ actually run. A genuinely empty/fresh DB has no tables at all, so
    # baseline-on-migrate never triggers for it and it runs V1 (then V2+) from scratch instead.
    baseline-on-migrate: true
    baseline-version: 1

  servlet:
    multipart:
      # Matches FileUploadPolicy's MAX_ATTACHMENT_SIZE_BYTES (25MB) with a little headroom for the
      # rest of the multipart request; a too-large upload is rejected by Spring before it ever
      # reaches the policy, so the two limits need to stay in the same ballpark.
      max-file-size: 25MB
      max-request-size: 30MB



server:
  port: 80

app:
  # Externally-reachable base URL of this API - used only to build the absolute webhook URL shown
  # once at VCS connection creation time (see VcsWebhookUrl), since that URL gets pasted into a
  # third-party provider's own webhook config, unlike PublicFileUrl's relative paths which the
  # frontend resolves against a base URL it already knows.
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  # Externally-reachable base URL of the FRONTEND - SSO providers redirect the browser back to
  # {front-url}/login/sso/{provider}, and that exact route is the only redirect_uri the API accepts
  # (see SsoRedirectUri). It must also be registered as a redirect URI in each provider's own app
  # settings (Google Cloud console, Entra app registration, GitHub OAuth app, the OIDC IdP).
  front-url: ${APP_FRONT_URL:http://localhost:5173}
  storage:
    # Local-disk root for uploaded files (see LocalDiskFileStorageAdapter) - point this at a mounted
    # volume in production so uploads survive container restarts/redeploys.
    root: ${STORAGE_ROOT:/var/vantacore/storage}
  notification:
    # How often NotificationDigestFlushJob batches up and pushes DIGEST-mode notifications -
    # 15 minutes by default.
    digest-flush-interval-ms: ${NOTIFICATION_DIGEST_FLUSH_INTERVAL_MS:900000}
  security:
    # Symmetric key for at-rest encryption of stored secrets (import connection tokens, VCS webhook
    # secrets - see CredentialEncryptor) - hashed into an AES-256 key, so any length string works,
    # not just exactly 32 bytes.
    # No default for the same reason as spring.security.jwt.secret - required outside the dev profile.
    credential-encryption-key: ${CREDENTIAL_ENCRYPTION_KEY}
  ollama:
    # "ollama" = the docker-compose service name, not localhost - see OllamaClient. bge-m3 dims
    # (1024) are baked into V29's `vector(1024)` column; changing the embedding model means a
    # migration + full reindex, not just an env var flip.
    base-url: ${OLLAMA_BASE_URL:http://ollama:11434}
    embedding-model: ${OLLAMA_EMBEDDING_MODEL:bge-m3}
    generation-model: ${OLLAMA_GENERATION_MODEL:qwen2.5:3b-instruct}


springdoc:
  api-docs:
    path: /v3/api-docs
  # api-docs itself stays on - the MCP endpoint reads /v3/api-docs over loopback (see
  # OpenApiOperationCatalog). Only the interactive UI is opt-in (on by default in the dev profile).
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_UI_ENABLED:false}
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true
  show-actuator: false

logging:
  level:
    root: INFO
