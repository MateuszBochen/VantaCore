server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # BrowserRouter (see App.tsx) - any unknown path falls back to index.html
    # so client-side routing can take over instead of nginx 404ing it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
